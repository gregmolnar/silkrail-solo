<% require "dotenv"; Dotenv.load(".env") %>
# Every deployment-specific value can be supplied through the environment.
# Copy .env.example to .env, fill it in, then export it before running Kamal.
# Secrets are resolved by .kamal/secrets.
service: <%= ENV.fetch("KAMAL_SERVICE", "silkrail-solo") %>
image: <%= ENV.fetch("KAMAL_IMAGE", "silkrail-solo") %>

servers:
  web:
<% ENV.fetch("KAMAL_WEB_HOSTS", "192.168.0.1").split(",").map(&:strip).each do |host| %>
    - <%= host %>
<% end %>
<% unless ENV.fetch("SOLID_QUEUE_IN_PUMA", "true") == "true" %>
  job:
    hosts:
<% job_hosts = ENV["KAMAL_JOB_HOSTS"].to_s.empty? ? ENV.fetch("KAMAL_WEB_HOSTS", "192.168.0.1") : ENV["KAMAL_JOB_HOSTS"] %>
<% job_hosts.split(",").map(&:strip).each do |host| %>
      - <%= host %>
<% end %>
    cmd: bin/jobs
<% end %>

proxy:
  ssl: <%= ENV.fetch("KAMAL_PROXY_SSL", "true") %>
  host: <%= ENV.fetch("APP_HOST", "shop.example.com") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "localhost:5555") %>
<% if ENV["KAMAL_REGISTRY_USERNAME"].to_s != "" %>
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD
<% end %>

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
  clear:
    APP_HOST: <%= ENV.fetch("APP_HOST", "shop.example.com") %>
    FORCE_SSL: <%= ENV.fetch("FORCE_SSL", ENV.fetch("KAMAL_PROXY_SSL", "true")) %>
    SOLID_QUEUE_IN_PUMA: <%= ENV.fetch("SOLID_QUEUE_IN_PUMA", "true") %>
    JOB_CONCURRENCY: <%= ENV.fetch("JOB_CONCURRENCY", "1") %>
    WEB_CONCURRENCY: <%= ENV.fetch("WEB_CONCURRENCY", "1") %>
    RAILS_LOG_LEVEL: <%= ENV.fetch("RAILS_LOG_LEVEL", "info") %>
    ACTIVE_STORAGE_SERVICE: <%= ENV.fetch("ACTIVE_STORAGE_SERVICE", "s3") %>
    S3_ENDPOINT: "<%= ENV.fetch("S3_ENDPOINT", "") %>"
    S3_REGION: <%= ENV.fetch("S3_REGION", "auto") %>
    S3_BUCKET: <%= ENV.fetch("S3_BUCKET", "silkrail") %>
    S3_FORCE_PATH_STYLE: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") %>
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM", "downloads@example.com") %>
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "smtp.example.com") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    SMTP_AUTHENTICATION: <%= ENV.fetch("SMTP_AUTHENTICATION", "plain") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  migrate: app exec --primary --reuse "bin/rails db:prepare"
  jobs: app exec --reuse "bin/rails solid_queue:start"

volumes:
  - "<%= ENV.fetch("KAMAL_STORAGE_VOLUME", "silkrail-solo-storage") %>:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: <%= ENV.fetch("KAMAL_BUILDER_ARCH", "amd64") %>

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "root") %>
